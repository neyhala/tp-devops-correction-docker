name: CI devops 2025

# Quand lancer le pipeline
on:
  # à chaque push sur les branches main et develop
  push:
    branches:
      - main
      - develop
  # et à chaque pull request
  pull_request:

jobs:
  # Job 1 : compiler et tester l'API
  test-backend:
    # machine virtuelle Ubuntu fournie par GitHub
    runs-on: ubuntu-24.04
    steps:
      # récupère le code du dépôt sur la machine
      - uses: actions/checkout@v4

      # installe Java 21 (distribution Temurin)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # compile l'application et lance les tests unitaires + d'intégration
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml
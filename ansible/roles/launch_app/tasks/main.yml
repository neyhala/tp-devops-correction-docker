---
# Lance l'API Spring Boot, connectée à la base via le réseau app-network
- name: Run backend API
  community.docker.docker_container:
    name: simple-api
    image: "{{ dockerhub_user }}/tp-devops-simple-api:latest"
    pull: always
    state: started
    restart_policy: unless-stopped
    env:
      # Spring Boot lit ces variables à la place des valeurs de application.yml
      SPRING_DATASOURCE_URL: "jdbc:postgresql://database:5432/{{ db_name }}"
      SPRING_DATASOURCE_USERNAME: "{{ db_user }}"
      SPRING_DATASOURCE_PASSWORD: "{{ db_password }}"
    networks:
      - name: app-network
        aliases:
          - backend
          - api